name: End-to-end stack test

# Builds the full SmartHome stack from the four repositories and runs
# deploy/smoke-test.sh against it.
on:
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - '.github/workflows/e2e-stack.yml'
  pull_request:
    branches: [main]
    paths:
      - 'deploy/**'
      - '.github/workflows/e2e-stack.yml'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag of the code repositories to test
        required: false
        default: main

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CODE_REF: ${{ github.event.inputs.ref || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: smart-home-doc
      - uses: actions/checkout@v4
        with:
          repository: nataliachala1/smarthome-database
          ref: ${{ env.CODE_REF }}
          path: smarthome-database
      - uses: actions/checkout@v4
        with:
          repository: nataliachala1/smarthome-backend
          ref: ${{ env.CODE_REF }}
          path: smarthome-backend
      - uses: actions/checkout@v4
        with:
          repository: nataliachala1/smarthome-frontend-web
          ref: ${{ env.CODE_REF }}
          path: smarthome-frontend-web
      - name: Create disposable secrets
        working-directory: smart-home-doc/deploy
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "APP_DB_PASSWORD=$(openssl rand -hex 16)"
            echo "IOT_DB_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
          } > .env
      - name: Build and start the stack
        working-directory: smart-home-doc/deploy
        run: docker compose up -d --build --wait
      - name: Run the smoke test
        working-directory: smart-home-doc/deploy
        run: ./smoke-test.sh
      - name: Show logs on failure
        if: failure()
        working-directory: smart-home-doc/deploy
        run: docker compose logs --no-color --tail=200
      - name: Stop the stack
        if: always()
        working-directory: smart-home-doc/deploy
        run: docker compose down -v
